<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <title>CineTrack</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <h1>CineTrack</h1>
            <input type="search" aria-label="Buscar filme" placeholder="Buscar filme">
            <button>
                <span class="mobile">+</span>
                <span class="desktop">+ Adicionar</span>
            </button>
        </header>
        <nav aria-label="Filtros de status">
            <button class="ativo" data-status="todos">Todos</button>
            <button data-status="assistido">Assistido</button>
            <button data-status="assistindo">Assistindo</button>
            <button data-status="quero">Quero assistir</button>
        </nav>
        <main>
            <section id="lista" aria-live="polite">
            </section>
        </main>
        <footer>
            <small id="copyright">CineTrack - UEM</small>
            <br>
        </footer>
        <div id="modal" hidden>
            <div id="modal-conteudo">
                <a href="index.html">← Voltar</a>
                <h1>Adicionar filme</h1>
                <form id="form-filme">
                    <label for="titulo">Título</label>
                    <br>
                    <input id="titulo" name="titulo" type="text" required>
                    <br>
                    <br>
                    <label for="ano">Ano</label>
                    <br>
                    <input id="ano" name="ano" type="number" min="1888" max="2030" step="1" required>
                    <br>
                    <br>
                    <label for="genero">Gênero</label>
                    <br>
                    <input id="genero" name="genero" required>
                    <br>
                    <br>
                    <label for="url">URL do pôster</label>
                    <br>
                    <input id="url" name="url" type="text">
                    <br>
                    <br>
                    <label for="status">Status</label>
                    <br>
                    <select id="status" name="status" required>
                        <option value="assistido">Assistido</option>
                        <option value="assisindo">Assistindo</option>
                        <option value="quero assistir">Quero assistir</option>
                    </select>
                    <br>
                    <br>
                    <label for="nota">Nota (1 a 5)</label>
                    <br>
                    <input id="nota" name="nota" type="number" min="1" max="5" step="1">
                    <br>
                    <br>
                    <label for="comentario">Comentário</label>
                    <br>
                    <textarea id="comentario" name="comentario" rows="3" cols="50"></textarea>
                    <br>
                    <br>
                    <button type="button">Cancelar</button>
                    <button type="submit">Salvar</button>
                </form>
            </div>
        </div>
        <script src="app.js"></script>
    </body>
</html>
